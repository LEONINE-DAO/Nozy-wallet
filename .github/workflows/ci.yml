name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      # Strict on workspace members that are clippy-clean. `nozy` is excluded from `-D warnings`
      # until a dedicated cleanup lands (see PRODUCTION_CHECKLIST.md).
      - name: Clippy (zeaking, strict)
        run: cargo clippy -p zeaking --all-targets --all-features -- -D warnings

      - name: Clippy (nozywallet-api, strict, no-deps)
        run: cargo clippy -p nozywallet-api --all-targets --all-features --no-deps -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Run unit tests
        run: cargo test --lib --bins

      - name: Run unit tests (verbose, on failure)
        if: failure()
        run: cargo test --lib --bins -- --nocapture

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Run integration tests (if Zebra available)
        env:
          ZEBRA_RPC_URL: ${{ secrets.ZEBRA_RPC_URL || 'http://127.0.0.1:8232' }}
        run: |
          echo "⚠️  Integration tests require a Zebra node"
          echo "These tests are marked with #[ignore] and won't run in CI unless Zebra is available"
          cargo test --test integration_tests -- --ignored || echo "Integration tests skipped (Zebra not available)"

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Soft-fail: open RUSTSEC on transitive rustls-webpki / ecosystem until lockfile upgrades land.
      - name: Run security audit
        run: cargo audit || echo "Security audit found issues - see Dependabot alerts"
        continue-on-error: true

  cargo-chec:
    name: Cargo chec (parallel checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Install cargo-chec
        run: cargo install cargo-chec --locked

      - name: Run cargo-chec (parallel checks)
        run: cargo chec || echo "Some checks failed - see output above"
        continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Build CLI
        run: cargo build --release --bin nozy

      - name: Build API Server
        run: cargo build --release --package nozywallet-api

  api-smoke:
    name: Companion API Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            .
            zeaking
            api-server

      - name: Build API Server
        run: cargo build --release --package nozywallet-api

      - name: Boot companion and smoke
        run: |
          set -euo pipefail
          export HOME="${RUNNER_TEMP}/nozy-api-smoke-home"
          export XDG_DATA_HOME="${HOME}/.local/share"
          mkdir -p "$XDG_DATA_HOME"
          export NOZY_BIND_ADDR=127.0.0.1
          export NOZY_HTTP_PORT=3000
          # Dev mode (no NOZY_PRODUCTION) so smoke does not need an API key.
          unset NOZY_PRODUCTION || true
          unset NOZY_API_KEY || true

          ./target/release/nozywallet-api >"${RUNNER_TEMP}/nozywallet-api.log" 2>&1 &
          API_PID=$!
          cleanup() {
            kill "$API_PID" 2>/dev/null || true
            wait "$API_PID" 2>/dev/null || true
            echo "---- nozywallet-api log ----"
            cat "${RUNNER_TEMP}/nozywallet-api.log" || true
          }
          trap cleanup EXIT

          for i in $(seq 1 60); do
            if curl -fsS --connect-timeout 1 --max-time 2 "http://127.0.0.1:3000/health" >/dev/null; then
              echo "API ready after ${i}s"
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process exited early"
              exit 1
            fi
            sleep 1
            if [[ "$i" -eq 60 ]]; then
              echo "Timed out waiting for /health"
              exit 1
            fi
          done

          chmod +x api-server/scripts/smoke-companion.sh
          BASE_URL=http://127.0.0.1:3000 api-server/scripts/smoke-companion.sh

