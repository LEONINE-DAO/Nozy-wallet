[package]
name = "nozy-sync-engine"
version = "0.1.0"
edition = "2021"
description = "Nozy Sync Engine — Zebra/Zakura ingest + lightwalletd-compatible CompactTxStreamer for Zeaking"
authors = ["LEONINE-DAO"]
license = "MIT"
repository = "https://github.com/LEONINE-DAO/Nozy-wallet"
build = "build.rs"

[[bin]]
name = "nozy-sync-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba", default-features = false, features = ["std"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
orchard = { version = "0.15.0-pre.1", default-features = false }
incrementalmerkletree = { version = "0.8.2", default-features = false, features = ["legacy-api"] }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
