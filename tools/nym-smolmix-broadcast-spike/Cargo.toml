# Nym 1.21.6 still enables rustls on tungstenite 0.20 and reqwest 0.11 via
# tendermint-rpc 0.40.4. These patches move those edges onto rustls 0.23.46.
[patch.crates-io]
tungstenite = { path = "../nym-rustls-patch/tungstenite" }
tokio-tungstenite = { path = "../nym-rustls-patch/tokio-tungstenite" }
tendermint-rpc = { path = "../nym-rustls-patch/tendermint-rpc" }
