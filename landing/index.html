<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/Nozy-wallet/logo.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="keywords"
      content="privacy wallet, zcash wallet, orchard, ironwood, NU6.3, monero alternative, private cryptocurrency, untraceable transactions, zero-knowledge proofs, shielded transactions"
    />
    <meta
      name="description"
      content="NozyWallet is a shielded-first Zcash wallet for Orchard and Ironwood (NU6.3). Self-custodial, transparent addresses blocked, privacy by default."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <title>NozyWallet — Shielded Zcash, private by default</title>
  </head>
  <body style="margin:0;background:#0c0b09;color:#f5f0e6;">
    <script type="text/javascript">
      // Restore deep links after GitHub Pages 404.html redirect (see public/404.html)
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
