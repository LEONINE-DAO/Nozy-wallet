[package]
name = "nozy-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for Nozy Sapling legacy status / scan / shield-to-self (on-device mobile)"
license = "MIT"
repository = "https://github.com/LEONINE-DAO/Nozy-wallet"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "nozy_ffi"

[dependencies]
nozy = { path = "../", default-features = true }
zeaking = { path = "../zeaking", features = ["lightwalletd"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "4d9a68dc80508e7644aa99e1b4add7c831057bba" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0"
uniffi = { version = "0.28", features = ["tokio"] }
