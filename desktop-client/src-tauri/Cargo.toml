[workspace]

[package]
name = "nozywallet-desktop"
version = "1.0.0-beta.8"
edition = "2021"

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
hex = "0.4"
sha2 = "0.10"
zcash_protocol = { path = "../../third_party/zcash_protocol" }
indexmap = { version = "2.13.1", features = ["std"] }

# NozyWallet core - use path to parent directory
nozy = { path = "../../" }
zeaking = { path = "../../zeaking", features = ["lightwalletd"] }
# Vote SDK (`zcash_voting`) cannot link into this binary: rusqlite 0.37 vs zeaking 0.39
# both `links = "sqlite3"`. Desktop shells out to the `nozy-vote` helper binary instead.
directories = "5"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

# Keep in sync with root Cargo.toml [patch.crates-io] for ark-relations.
[patch.crates-io]
ark-relations = { path = "../../vendor/ark-relations-0.3.0" }

# The git pin still maps NU7 to 0xffffffff. Use the vendored ZIP 259 id.
[patch."https://github.com/zcash/librustzcash"]
zcash_protocol = { path = "../../third_party/zcash_protocol" }
